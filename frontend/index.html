<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>RAG Assistant</h1>
      <p>Ask questions about your knowledge base documents.</p>
    </header>

    <main id="chat" aria-live="polite">
      <div class="msg bot">Hi! Ask me anything about the documents in the knowledge base.</div>
    </main>

    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type your question…" required />
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
